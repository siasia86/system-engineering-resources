title = "gitleaks config"

[allowlist]
description = "global allowlist"
regexes = [
    # placeholder values
    '''Secureuser123''',
    '''SecurePassword123''',
    '''SecureKey123''',
    '''SecureToken123''',
    '''SecureDbName123''',
    # RFC 5737 documentation IP ranges
    '''192\.0\.2\.\d+''',
    '''198\.51\.100\.\d+''',
    '''203\.0\.113\.\d+''',
]
paths = [
    '''12_tech_stack/kubernetes_basic\.md''',
    '''.*_test\.py''',
    '''.*\.example''',
    '''.*\.sample''',
]

# 커스텀 규칙: AWS 12자리 계정 ID 탐지
# 주의: Go regex는 lookahead/lookbehind 미지원
# 따옴표·공백으로 감싸인 12자리 숫자를 탐지
[[rules]]
id = "custom-aws-account-id"
description = "AWS Account ID (12-digit)"
regex = '''["'\s][0-9]{12}["'\s]'''
tags = ["aws", "account"]
[rules.allowlist]
regexes = [
    # 날짜/시간 형태 제외 (YYYYMMDDHHNN)
    '''20[0-9]{2}[01][0-9][0-3][0-9][0-9]{4}''',
]
