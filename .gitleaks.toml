title = "gitleaks config"

[allowlist]
description = "global allowlist"
regexes = [
    # placeholder values
    '''Secureuser123''',
    '''SecurePassword123''',
    '''SecureKey123''',
    '''SecureToken123''',
    '''SecureDbName123''',
    # RFC 5737 documentation IP ranges
    '''192\.0\.2\.\d+''',
    '''198\.51\.100\.\d+''',
    '''203\.0\.113\.\d+''',
    # 코드 예시 전화번호
    '''010-1234-5678''',
]
paths = [
    '''12_tech_stack/kubernetes_basic\.md''',
    '''.*_test\.py''',
    '''.*\.example''',
    '''.*\.sample''',
    '''.*_example\..*''',
]

# 한국 휴대폰 번호
[[rules]]
id = "korean-phone-number"
description = "Korean mobile phone number"
regex = '''010[-\s]?[0-9]{3,4}[-\s]?[0-9]{4}'''
tags = ["pii", "phone"]
[rules.allowlist]
regexes = [
    '''01000000000''',
    '''01012345678''',
    '''010-1234-5678''',
]

# Slack Webhook URL
[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+'''
tags = ["webhook", "slack"]

# 회사 외부 IP 대역
[[rules]]
id = "company-external-ip"
description = "Company external IP range (112.x.x.x)"
regex = '''112\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'''
tags = ["network", "external"]