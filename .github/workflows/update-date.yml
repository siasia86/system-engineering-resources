name: Markdown validation and README dates

on:
  workflow_dispatch:
  push:
    branches: [main, yunli]
    paths:
      - '**/*.md'
      - '*.py'
      - '**/*.toml'
      - '.github/workflows/update-date.yml'
  pull_request:
    branches: [main, yunli]
    paths:
      - '**/*.md'
      - '*.py'
      - '**/*.toml'
      - '.github/workflows/update-date.yml'

permissions:
  contents: read

env:
  SIA_SCRIPTS_REPOSITORY: siasia86/30_sia-scripts
  SIA_SCRIPTS_RELEASE_VERSION: '0.3.2'
  SIA_SCRIPTS_RELEASE_SHA256: 9f9b74a0b21926a55a72fc11fbb59cd049da176413e5617249af3ecf68dabcc4

jobs:
  validate-markdown:
    name: Validate Markdown with pinned sia_scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download pinned sia_scripts release
        env:
          SIA_SCRIPTS_RELEASE_TOKEN: ${{ secrets.SIA_SCRIPTS_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$SIA_SCRIPTS_RELEASE_VERSION"
          archive="sia_scripts_${version}.tar.gz"
          download_dir="$RUNNER_TEMP/sia_scripts_download"
          extract_dir="$RUNNER_TEMP/sia_scripts_release"
          mkdir -p "$download_dir" "$extract_dir"

          : "${SIA_SCRIPTS_RELEASE_TOKEN:?SIA_SCRIPTS_RELEASE_TOKEN secret is required for private 30_sia-scripts access}"
          GH_TOKEN="${SIA_SCRIPTS_RELEASE_TOKEN}" gh release download "v${version}" \
            --repo "$SIA_SCRIPTS_REPOSITORY" \
            --pattern "$archive" \
            --dir "$download_dir"

          printf '%s  %s\n' "$SIA_SCRIPTS_RELEASE_SHA256" "$archive" > "$download_dir/$archive.sha256"
          (
            cd "$download_dir"
            sha256sum --check "$archive.sha256"
          )

          tar --extract --file "$download_dir/$archive" --directory "$extract_dir"
          artifact_root="$extract_dir/sia_scripts_${version}"
          test -f "$artifact_root/.release-manifest.json"
          test -x "$artifact_root/src/bin/sia-md-style-check"
          test -x "$artifact_root/src/bin/sia-md-heading-check"
          test -x "$artifact_root/src/bin/sia-md-link-check"
          test -x "$artifact_root/src/bin/sia-readme-inventory-check"

          python3 - "$artifact_root/.release-manifest.json" "$artifact_root" "$version" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest_path, root_name, expected_version = sys.argv[1:]
          root = Path(root_name).resolve()
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          assert manifest["name"] == "sia_scripts"
          assert manifest["version"] == expected_version
          for entry in manifest["files"]:
              path = (root / entry["path"]).resolve()
              path.relative_to(root)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == entry["sha256"], entry["path"]
          print(f"verified release manifest and {len(manifest['files'])} embedded files")
          PY

          echo "SIA_SCRIPTS_BIN=$artifact_root/src/bin" >> "$GITHUB_ENV"

      - name: Check internal links with pinned sia_scripts
        run: "$SIA_SCRIPTS_BIN/sia-md-link-check ."

      - name: Check Markdown style with pinned sia_scripts
        run: "$SIA_SCRIPTS_BIN/sia-md-style-check --config .md-style-check.sia_scripts.toml ."

      - name: Check file skip reasons with pinned sia_scripts
        run: "$SIA_SCRIPTS_BIN/sia-md-style-check --config .md-style-check.sia_scripts.toml --list-skips ."

      - name: Check README inventory with pinned sia_scripts
        run: "$SIA_SCRIPTS_BIN/sia-readme-inventory-check README.md"

      - name: Check heading structure with pinned sia_scripts
        run: "$SIA_SCRIPTS_BIN/sia-md-heading-check ."

  update-date:
    name: Update README dates
    # yunli 에서만 날짜 커밋을 생성합니다. main 에도 적용하면 branch 별로
    # 별개의 봇 커밋이 생겨 main 과 yunli 가 매번 분기합니다.
    # main 은 yunli 병합으로 날짜 변경을 전달받습니다.
    if: github.event_name == 'push' && github.ref_name == 'yunli'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update dates in changed Markdown files
        shell: bash
        run: |
          set -euo pipefail
          today=$(date +%Y-%m-%d)
          changed=$(git diff --name-only HEAD^ HEAD -- '*.md' || true)

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            # 도구 미러는 원본(~/.kiro/)의 사본입니다. 여기서 날짜를 고치면
            # 다음 동기화가 되돌리므로 봇 커밋과 동기화가 서로를 덮어씁니다.
            case "$file" in
              00_governance/02_kiro/*) continue ;;
            esac
            if [ -f "$file" ] && grep -q '^\*\*마지막 업데이트\*\*' "$file"; then
              sed -i "s/\*\*마지막 업데이트\*\*: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/**마지막 업데이트**: $today/" "$file"
              git add "$file"
            fi
          done <<< "$changed"

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No date changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update last modified date'
          git push origin "${GITHUB_REF_NAME}"
