name: Markdown validation and README dates

on:
  push:
    branches: [main, yunli]
    paths:
      - '**/*.md'
      - '*.py'
      - '.md-style-check.toml'
      - '.md-heading-check.toml'
      - '.github/workflows/update-date.yml'
  pull_request:
    branches: [main, yunli]
    paths:
      - '**/*.md'
      - '*.py'
      - '.md-style-check.toml'
      - '.md-heading-check.toml'
      - '.github/workflows/update-date.yml'

permissions:
  contents: read

jobs:
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check internal links
        run: python3 md-link-check.py .

      - name: Check Markdown style
        run: python3 md-style-check.py .

      - name: Check file skip reasons
        run: python3 md-style-check.py --list-skips

      - name: Check README inventory
        run: python3 readme_inventory_check.py README.md

      - name: Check heading structure
        run: python3 md-heading-check.py .

  update-date:
    name: Update README dates
    # yunli 에서만 날짜 커밋을 생성합니다. main 에도 적용하면 branch 별로
    # 별개의 봇 커밋이 생겨 main 과 yunli 가 매번 분기합니다.
    # main 은 yunli 병합으로 날짜 변경을 전달받습니다.
    if: github.event_name == 'push' && github.ref_name == 'yunli'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update dates in changed Markdown files
        shell: bash
        run: |
          set -euo pipefail
          today=$(date +%Y-%m-%d)
          changed=$(git diff --name-only HEAD^ HEAD -- '*.md' || true)

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            # 도구 미러는 원본(~/.kiro/)의 사본입니다. 여기서 날짜를 고치면
            # 다음 동기화가 되돌리므로 봇 커밋과 동기화가 서로를 덮어씁니다.
            case "$file" in
              00_governance/02_kiro/*) continue ;;
            esac
            if [ -f "$file" ] && grep -q '^\*\*마지막 업데이트\*\*' "$file"; then
              sed -i "s/\*\*마지막 업데이트\*\*: [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}/**마지막 업데이트**: $today/" "$file"
              git add "$file"
            fi
          done <<< "$changed"

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No date changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update last modified date'
          git push origin "${GITHUB_REF_NAME}"
